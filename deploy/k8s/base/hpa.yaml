apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nflproj-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nflproj-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Fantasy traffic is spiky in a predictable way: it arrives in the hour
      # before Sunday kickoff and then leaves. Scale up promptly.
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Down slowly. Each pod holds a bundle it had to read and verify at
      # startup, so shedding one that is about to be needed again is not free.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
