name: Weekly scorecard

# The public track record. Runs after every NFL week has finished, re-scores the
# projections that were published before those games, rebuilds the page and
# deploys it.
#
# The scorecard is committed as well as deployed. Deploying makes it visible;
# committing makes it permanent - the history of what this system claimed, and
# when, lives in git where it cannot be quietly revised after the fact.

on:
  schedule:
    # Tuesday 12:00 UTC - after Monday night football, and after nflverse has
    # rebuilt its weekly stats.
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season range to backtest, e.g. 2015-2026"
        required: false
        default: "2015-2026"
      deploy:
        description: "Deploy the page to GitHub Pages"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - run: uv sync --locked

      - name: how far has the season got
        run: uv run nflproj status

      - name: refresh upstream data
        run: uv run nflproj ingest --seasons "${{ inputs.seasons || '2015-2026' }}" --force

      - name: score the decision-grade universe
        run: |
          uv run nflproj backtest \
            --seasons "${{ inputs.seasons || '2015-2026' }}" \
            --universe active_recent \
            --stem scorecard

      - name: score the played-only universe for comparability
        run: |
          uv run nflproj backtest \
            --seasons "${{ inputs.seasons || '2015-2026' }}" \
            --universe played \
            --stem scorecard_played_only

      # Season and week are derived from the schedule, so the job never has to
      # know today's date or which week the NFL is on.
      - name: build the public page
        run: uv run nflproj report

      - name: commit the track record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "scorecard unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(scorecard): weekly refresh $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy:
    needs: scorecard
    if: inputs.deploy != false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
