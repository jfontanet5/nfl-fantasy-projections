name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      # Unit tests are hermetic: no network, no upstream data, fully
      # deterministic. They gate every PR.
      - name: unit tests
        run: >
          uv run pytest tests/unit
          -m "not network"
          --cov=nflproj --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: upstream contract
    runs-on: ubuntu-latest
    # Hits the live nflverse releases. Separated from `test` so an upstream
    # outage or schema migration is reported as its own distinct failure
    # rather than looking like a code regression.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: integration tests
        run: uv run pytest tests/integration -m network -v

  docker:
    name: container
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nflproj:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the image actually runs
        run: |
          docker run --rm nflproj:ci --help
          docker run --rm nflproj:ci project --help
      - name: the image runs unprivileged
        run: |
          uid=$(docker run --rm --entrypoint id nflproj:ci -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }
