name: CI

on:
  push:
    branches: [main]
    # The injury snapshotter commits to main several times a week and touches
    # nothing else. Rebuilding and republishing a container image because a
    # 22 KB parquet arrived would burn minutes to produce a byte-identical
    # result. Everything else on main still runs the full pipeline.
    paths-ignore:
      - "archive/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      # Unit tests are hermetic: no network, no upstream data, fully
      # deterministic. They gate every PR.
      - name: unit tests
        run: >
          uv run pytest tests/unit
          -m "not network"
          --cov=nflproj --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: upstream contract
    runs-on: ubuntu-latest
    # Hits the live nflverse releases. Separated from `test` so an upstream
    # outage or schema migration is reported as its own distinct failure
    # rather than looking like a code regression.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: integration tests
        run: uv run pytest tests/integration -m network -v

  container:
    name: container + kubernetes
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras

      # The image ships the model artifact, so building one is part of building
      # the image. This is the only step here that touches nflverse; if it
      # fails, the log says so rather than leaving a mystery container error.
      - name: build the model bundle the image will carry
        run: |
          uv run nflproj ingest --seasons 2024-2026
          uv run nflproj publish
          cat bundle/bundle.json

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nflproj:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image runs, and runs unprivileged
        run: |
          docker run --rm nflproj:ci --help > /dev/null
          docker run --rm nflproj:ci project --help > /dev/null
          uid=$(docker run --rm --entrypoint id nflproj:ci -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }

      # ------------------------------------------------------------ kubernetes
      #
      # A real cluster, the real manifests, and an assertion that a projection
      # comes back out of the Service. Writing the YAML proves nothing on its
      # own; this is the part that shows it works.

      - uses: helm/kind-action@v1
        with:
          cluster_name: nflproj
          wait: 120s

      - name: load the image into the cluster
        run: kind load docker-image nflproj:ci --name nflproj

      - name: the manifests are valid before anything is applied
        run: kubectl apply -k deploy/k8s/overlays/kind --dry-run=server

      - name: deploy
        run: kubectl apply -k deploy/k8s/overlays/kind

      - name: wait for the rollout
        run: |
          # Fails if readiness never goes green - which is exactly what a bad
          # bundle would cause, so this step is also the integrity check's
          # end-to-end test.
          kubectl rollout status deployment/nflproj-api --timeout=180s
          kubectl get pods -l app.kubernetes.io/name=nflproj -o wide

      - name: the service answers with a real projection
        run: |
          kubectl port-forward service/nflproj-api 8080:80 &
          for i in $(seq 1 30); do
            curl -sf localhost:8080/readyz > /dev/null && break
            sleep 2
          done

          echo "--- readyz ---"
          curl -sf localhost:8080/readyz | tee /tmp/ready.json
          echo "--- version ---"
          curl -sf localhost:8080/version | tee /tmp/version.json

          season=$(jq -r .season /tmp/version.json)
          week=$(jq -r .week /tmp/version.json)
          echo "--- board for $season week $week ---"
          curl -sf "localhost:8080/projections/$season/$week?limit=5" > /tmp/board.json
          jq '{season, week, total, top: [.projections[] | {rank, player_name, projected_points}]}' /tmp/board.json

          # The assertions. A 200 alone would pass with an empty board.
          test "$(jq -r .status /tmp/ready.json)" = "ready"
          test "$(jq '.projections | length' /tmp/board.json)" -eq 5
          test "$(jq '.projections[0].projected_points > 0' /tmp/board.json)" = "true"

          # Provenance has to survive the whole path: publish -> image -> pod ->
          # Service. If it does not, the number is unattributable at the point
          # where someone would actually consume it.
          test "$(jq -r '.provenance.bundle_version | length' /tmp/board.json)" -eq 16
          test "$(jq -r '.provenance.raw_asset_hashes | length > 0' /tmp/board.json)" = "true"

          # And the live path, not only the artifact read.
          curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"season":2026,"week":4,"players":[{"player_id":"x","position":"RB",
                 "games":[{"season":2026,"week":2,"fantasy_points":18.0},
                          {"season":2026,"week":3,"fantasy_points":4.0}]}]}' | tee /tmp/predict.json
          test "$(jq '.predictions[0].projected_points > 0' /tmp/predict.json)" = "true"

      - name: logs on failure
        if: failure()
        run: |
          kubectl describe deployment/nflproj-api || true
          kubectl get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl logs -l app.kubernetes.io/name=nflproj --tail=100 --all-containers || true

      # ------------------------------------------------------------- publish
      #
      # Only from main, and only after the cluster proved the image works.
      # GITHUB_TOKEN authenticates to ghcr, so there is no stored secret.

      - name: log in to ghcr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          # sha- tag is the immutable one. `latest` is a convenience; a rollback
          # names a sha, never "the previous latest", which is not a thing.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
